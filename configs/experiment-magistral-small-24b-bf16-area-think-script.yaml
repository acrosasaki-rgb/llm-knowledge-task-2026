name: magistral-small-24b-bf16-area-think
model_id: unsloth/Magistral-Small-2509-GGUF
backend: llama_cpp_server
parameter_count_billion: 24
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
max_new_tokens: 2176
num_candidates: 20
enable_thinking: null
llama_cpp_url: http://127.0.0.1:8080
save_raw_text: true
system_prefix: First draft your thinking process (inner monologue) until you arrive
  at a response. Format your response using Markdown, and use LaTeX for any mathematical
  equations. Write both your thoughts and the response in the same language as the
  input. Your thinking process must follow the template below:[THINK]Your thoughts
  or/and draft, like working through an exercise on scratch paper. Be as casual and
  as long as you want until you are confident to generate the response. Use the same
  language as the input.[/THINK]Here, provide a self-contained response.
relation_instructions:
  hasArea: 'The ground truth is the area value stored in Wikidata (property P2046,
    the same value shown in the Wikipedia infobox) for the entity with exactly this
    name. Recall that stored value in its original unit. Convert it to square kilometers
    only if that unit is not already square kilometers (1 hectare = 0.01 km2; 1,000,000
    m2 = 1 km2; 1 square mile = 2.589988 km2; 1 acre = 0.004047 km2). Return only
    the numeric value in square kilometers. Keep your [THINK] block to exactly two
    short sentences and nothing else: first one sentence saying what the entity is
    and where it is; then one sentence in the form "I recall X has an area of Y km2."
    quoting the stored figure from memory with every decimal digit. Do not deliberate,
    do not verify, do not list alternative values, and do not second-guess the recalled
    figure. Close the thinking there and answer.'
