name: qwen3.5-9b-thinking-self-consistency-5-2048-two-stage
model_id: Qwen/Qwen3.5-9B
backend: multimodal
parameter_count_billion: 9
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
max_new_tokens: 2048
final_answer_tokens: 128
num_candidates: 5
enable_thinking: true
torch_dtype: auto
device_map: auto
generation:
  do_sample: true
  temperature: 0.6
  top_p: 0.95
aggregation:
  awardWonBy:
    strategy: frequency
    threshold: 0.05
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.5
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
  hasArea:
    strategy: median
  hasCapacity:
    strategy: median
  personHasCityOfDeath:
    strategy: majority
