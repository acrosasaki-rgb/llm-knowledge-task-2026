name: mistral-small-24b-bf16-val
model_id: unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF
backend: llama_cpp_server
parameter_count_billion: 24
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
max_new_tokens: 2176
num_candidates: 20
enable_thinking: null
llama_cpp_url: http://127.0.0.1:8080
save_raw_text: true
relation_instructions:
  hasArea: The ground truth is the area value stored in Wikidata (property P2046,
    the same value shown in the Wikipedia infobox) for the entity with exactly this
    name. Recall that stored value in its original unit. Convert it to square kilometers
    only if that unit is not already square kilometers (1 hectare = 0.01 km2; 1,000,000
    m2 = 1 km2; 1 square mile = 2.589988 km2; 1 acre = 0.004047 km2). Return only
    the numeric value in square kilometers.
generation:
  do_sample: true
  temperature: 0.6
  top_p: 0.95
aggregation:
  awardWonBy:
    strategy: frequency
    threshold: 0.05
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.6
    empty_aware: true
    empty_majority: 10
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  hasArea:
    strategy: unit_equivalence
    cluster_tolerance: 0.05
    unit_tolerance: 0.05
  hasCapacity:
    strategy: dominant_cluster
    cluster_tolerance: 0.05
  personHasCityOfDeath:
    strategy: majority
    explicit_empty_only: true
