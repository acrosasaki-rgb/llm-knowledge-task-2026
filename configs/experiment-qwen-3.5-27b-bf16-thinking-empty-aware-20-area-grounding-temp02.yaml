name: qwen3.5-27b-bf16-thinking-empty-aware-20-area-grounding-temp02
model_id: unsloth/Qwen3.5-27B-GGUF
backend: llama_cpp_server
parameter_count_billion: 27
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
# llama.cpp enforces a 2,048-token reasoning budget inside this total request
# budget, leaving up to 128 tokens for the final JSON array.
max_new_tokens: 2176
num_candidates: 20
enable_thinking: true
llama_cpp_url: http://127.0.0.1:8080
save_raw_text: true
# Grounding variant (follow-up to the unit-recall experiment): targets the
# three residual hasArea error classes at once.
# 1. Referent choice (Basque Country row: the model wrote the gold Euskal
#    Herria figure in its thinking 20/20 times, then answered with the
#    autonomous community) -> "entity with exactly this name".
# 2. Surface-form recall (Hashima digit error) -> recall the stored value in
#    its original unit; gold is the Wikidata P2046 preferred value.
# 3. Over-conversion (unit-recall run relabeled the correct 261 km2 of Saint
#    Kitts as square miles and converted it away) -> convert ONLY when the
#    stored unit is not km2.
# Sampling, seeds, few-shot, and the thinking budget stay identical to the
# BF16 20-candidate baseline pool.
relation_instructions:
  hasArea: >-
    The ground truth is the area value stored in Wikidata (property P2046,
    the same value shown in the Wikipedia infobox) for the entity with
    exactly this name. Recall that stored value in its original unit.
    Convert it to square kilometers only if that unit is not already square
    kilometers (1 hectare = 0.01 km2; 1,000,000 m2 = 1 km2;
    1 square mile = 2.589988 km2; 1 acre = 0.004047 km2). Return only the
    numeric value in square kilometers.
# Low-temperature arm (#34): factual single-answer accuracy favors low
# temperatures (production QA guidance 0.2-0.3; greedy-leaning decoding wins
# most single-shot configurations), while self-consistency literature places
# vote diversity at 0.7-0.9. 0.2 tests the exploit end of that trade-off on
# the majority-vote pipeline: sharper mode, narrower pool expected.
generation:
  do_sample: true
  temperature: 0.2
  top_p: 0.95
aggregation:
  awardWonBy:
    strategy: frequency
    threshold: 0.2
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  hasArea:
    strategy: unit_equivalence
    cluster_tolerance: 0.05
    unit_tolerance: 0.05
  hasCapacity:
    strategy: median
  personHasCityOfDeath:
    strategy: majority
    explicit_empty_only: true
