# Five-candidate extended-thinking arm (Issue #26, revised scope): identical
# to the 0.5662 thinking-empty-aware baseline generation and aggregation
# except the reasoning budget doubles to 4,096 tokens (max_new_tokens
# 4224 = 4,096 thinking + 128 answer). Serving uses the repository-default
# Q4_K_M GGUF. The comparison target is the same-aggregation 2,048-budget
# five-candidate baseline.
name: qwen3.5-27b-thinking-empty-aware-think4096-4096-plus-128
model_id: unsloth/Qwen3.5-27B-GGUF
backend: llama_cpp_server
parameter_count_billion: 27
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
max_new_tokens: 4224
num_candidates: 5
enable_thinking: true
llama_cpp_url: http://127.0.0.1:8080
generation:
  do_sample: true
  temperature: 0.6
  top_p: 0.95
aggregation:
  awardWonBy:
    strategy: frequency
    threshold: 0.2
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  hasArea:
    strategy: unit_equivalence
    cluster_tolerance: 0.05
    unit_tolerance: 0.05
  hasCapacity:
    strategy: median
  personHasCityOfDeath:
    strategy: majority
    explicit_empty_only: true
