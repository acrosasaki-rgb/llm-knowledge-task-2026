name: qwen3.5-9b-self-consistency-20
model_id: Qwen/Qwen3.5-9B
backend: multimodal
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
max_new_tokens: 64
num_candidates: 20
enable_thinking: false
torch_dtype: auto
device_map: auto
generation:
  do_sample: true
  temperature: 0.7
  top_p: 0.9
aggregation:
  awardWonBy:
    strategy: frequency
    threshold: 0.05
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.5
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
  hasArea:
    strategy: median
  hasCapacity:
    strategy: median
  personHasCityOfDeath:
    strategy: majority
