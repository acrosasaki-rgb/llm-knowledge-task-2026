name: mistral-small-24b-bf16-val
model_id: unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF
backend: llama_cpp_server
parameter_count_billion: 24
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
max_new_tokens: 2176
num_candidates: 20
enable_thinking: null
llama_cpp_url: http://127.0.0.1:8080
save_raw_text: true
relation_instructions:
  companyTradesAtStockExchange: The ground truth is the set of stock exchanges stored
    in Wikidata (property P414, the same values shown in the 'Traded as' line of the
    Wikipedia infobox) for the company with exactly this name. Recall every exchange
    recorded there — Wikidata often keeps several, including foreign and secondary
    listings — using each exchange's common English name. If Wikidata records no exchange
    (a private or unlisted company), return an empty list.
generation:
  do_sample: true
  temperature: 0.6
  top_p: 0.95
aggregation:
  awardWonBy:
    strategy: frequency
    threshold: 0.05
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.6
    empty_aware: true
    empty_majority: 10
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  hasArea:
    strategy: unit_equivalence
    cluster_tolerance: 0.05
    unit_tolerance: 0.05
  hasCapacity:
    strategy: dominant_cluster
    cluster_tolerance: 0.05
  personHasCityOfDeath:
    strategy: majority
    explicit_empty_only: true
