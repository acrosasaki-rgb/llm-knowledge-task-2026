name: qwen3.5-27b-bf16-numeric-multiroute
model_id: unsloth/Qwen3.5-27B-GGUF
backend: llama_cpp_server
parameter_count_billion: 27
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
# llama.cpp enforces a 2,048-token reasoning budget inside this total request
# budget, leaving up to 128 tokens for the final JSON array.
max_new_tokens: 2176
num_candidates: 20
enable_thinking: true
llama_cpp_url: http://127.0.0.1:8080
save_raw_text: true
# Multi-route cross-consensus: four independently prompted reasoning routes,
# five samples each, per numeric relation. Candidate index i belongs to route
# i // 5 (contiguous blocks); aggregation prefers the value cluster supported
# by the most distinct routes over the one merely repeated inside a single
# route (route_count -> sample_count -> log-space MAD). Routes share no
# conversation state; per-candidate seeds differ as usual.
candidate_instructions:
  hasArea:
    - &route_direct >-
      Direct recall route. Recall the requested value directly from your
      internal knowledge as a memorized fact about this exact subject. Do not
      derive it from population, importance, comparisons, or any other
      attribute.
    - *route_direct
    - *route_direct
    - *route_direct
    - *route_direct
    - &route_cued >-
      Cued recall route. First recall two to four highly relevant facts about
      this subject (its type, location, notable features) purely as retrieval
      cues, then determine the most likely stored value. Do not introduce
      unrelated quantities.
    - *route_cued
    - *route_cued
    - *route_cued
    - *route_cued
    - &route_compare >-
      Comparative estimation route. Estimate the value independently by
      comparing this subject with a small number of similar entities whose
      values you know well. Establish the reference values and the relative
      ordering first, then infer the target value. Do not simply repeat a
      memorized answer.
    - *route_compare
    - *route_compare
    - *route_compare
    - *route_compare
    - &route_fermi >-
      Independent estimation route. Estimate the value from quantitative
      constraints such as physical dimensions, scale, geometry, ratios, or
      other known quantities, then sanity-check the order of magnitude. Do not
      rely only on recalling an exact memorized number.
    - *route_fermi
    - *route_fermi
    - *route_fermi
    - *route_fermi
  hasCapacity:
    - *route_direct
    - *route_direct
    - *route_direct
    - *route_direct
    - *route_direct
    - *route_cued
    - *route_cued
    - *route_cued
    - *route_cued
    - *route_cued
    - *route_compare
    - *route_compare
    - *route_compare
    - *route_compare
    - *route_compare
    - *route_fermi
    - *route_fermi
    - *route_fermi
    - *route_fermi
    - *route_fermi
generation:
  do_sample: true
  temperature: 0.6
  top_p: 0.95
aggregation:
  awardWonBy:
    strategy: frequency
    threshold: 0.2
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  hasArea:
    strategy: route_consensus
    log_threshold: 0.05
    samples_per_route: 5
  hasCapacity:
    strategy: route_consensus
    log_threshold: 0.05
    samples_per_route: 5
  personHasCityOfDeath:
    strategy: majority
    explicit_empty_only: true
