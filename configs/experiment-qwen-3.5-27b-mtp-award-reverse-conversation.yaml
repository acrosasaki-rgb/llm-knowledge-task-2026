name: qwen3.5-27b-mtp-q4-k-m-award-reverse-conversation-2x10-no-thinking
model_id: unsloth/Qwen3.5-27B-MTP-GGUF
backend: llama_cpp_server
parameter_count_billion: 27
prompt_templates_file: prompt_templates/question_prompts.csv
train_data_file: data/train.jsonl
few_shot: 5
seed: 42
max_new_tokens: 128
num_candidates: 20
enable_thinking: false
relation_thinking:
  countryLandBordersCountry: false
  companyTradesAtStockExchange: false
  hasArea: false
  personHasCityOfDeath: false
  hasCapacity: false
  awardWonBy: false
conversation_chains:
  awardWonBy: 2
llama_cpp_url: http://127.0.0.1:8080
generation:
  do_sample: true
  temperature: 0.6
  top_p: 0.95
relation_instructions:
  countryLandBordersCountry: |
    For countryLandBordersCountry, first verify that the object countries share a direct land border with the subject country. Exclude maritime borders and nearby countries without a land border. If the subject has no direct land-border countries, return [].
  companyTradesAtStockExchange: |
    For companyTradesAtStockExchange, first verify whether the subject entity itself is publicly traded. Do not use a parent company, brand owner, subsidiary, predecessor, successor, or related company exchange unless that exact subject entity trades there. If the subject itself is private or not traded, return [].
  hasArea: |
    For hasArea, return the subject's total area in square kilometers as one numeric string. This relation is expected to have a non-empty numeric answer.
  personHasCityOfDeath: |
    For personHasCityOfDeath, return [] only when the person is alive or there is evidence that no death city exists. If deceased, return the death city or locality only. Do not substitute birthplace, residence, region, or country. Lack of recall alone is not evidence that the person is alive.
  hasCapacity: |
    For hasCapacity, return the maximum spectator capacity as one integer string. This relation is expected to have a non-empty numeric answer.
  awardWonBy: |
    For awardWonBy, return recipient entities, not works or award names. Avoid predecessor, successor, nominee, rescinded, or indirectly related entities. This is a multi-turn backward chronological enumeration. Use recipients from later periods as associative memory cues for earlier periods, but do not repeat recipients already returned in this conversation. Return each recipient at most once per conversation.
candidate_instructions:
  awardWonBy:
    - Start with the newest period. Return only recipients whose award event occurred from 2020 through 2026.
    - Continue backward. Return only recipients whose award event occurred from 2010 through 2019.
    - Continue backward. Return only recipients whose award event occurred from 2000 through 2009.
    - Continue backward. Return only recipients whose award event occurred from 1990 through 1999.
    - Continue backward. Return only recipients whose award event occurred from 1980 through 1989.
    - Continue backward. Return only recipients whose award event occurred from 1970 through 1979.
    - Continue backward. Return only recipients whose award event occurred from 1960 through 1969.
    - Continue backward. Return only recipients whose award event occurred from 1940 through 1959.
    - Continue backward. Return only recipients whose award event occurred from 1900 through 1939.
    - Finish with the oldest period. Return only recipients whose award event occurred before 1900.
    - Start with the newest period. Return only recipients whose award event occurred from 2020 through 2026.
    - Continue backward. Return only recipients whose award event occurred from 2010 through 2019.
    - Continue backward. Return only recipients whose award event occurred from 2000 through 2009.
    - Continue backward. Return only recipients whose award event occurred from 1990 through 1999.
    - Continue backward. Return only recipients whose award event occurred from 1980 through 1989.
    - Continue backward. Return only recipients whose award event occurred from 1970 through 1979.
    - Continue backward. Return only recipients whose award event occurred from 1960 through 1969.
    - Continue backward. Return only recipients whose award event occurred from 1940 through 1959.
    - Continue backward. Return only recipients whose award event occurred from 1900 through 1939.
    - Finish with the oldest period. Return only recipients whose award event occurred before 1900.
system_prefix: |
  Before the final JSON array, use reasoning only when thinking is enabled for this relation:
  1. Confirm the relation meaning and scope from the official relation definition.
  2. For relations where empty can be correct, decide whether the object set is truly empty.
  3. Do not use lack of recall alone as evidence for [].
  4. If non-empty, retrieve only objects that satisfy the relation.
  5. The final answer must be a JSON string array only.
aggregation:
  awardWonBy:
    strategy: grouped_frequency
    groups: 10
    threshold: 0.5
  companyTradesAtStockExchange:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  countryLandBordersCountry:
    strategy: frequency
    threshold: 0.4
    empty_aware: true
    empty_majority: 3
  hasArea:
    strategy: median
  hasCapacity:
    strategy: median
  personHasCityOfDeath:
    strategy: majority
    explicit_empty_only: true
